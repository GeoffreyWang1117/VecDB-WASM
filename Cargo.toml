[package]
name = "vecdb-wasm"
version = "0.3.0"
authors = ["VecDB Team"]
edition = "2021"
description = "A high-performance vector database for browsers using WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Navigator",
    "Performance",
    "PerformanceEntry",
    "PerformanceMark",
    "PerformanceMeasure",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbTransaction",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbTransactionMode",
    "IdbCursorWithValue",
    "IdbVersionChangeEvent",
    "DomStringList",
    "DomException",
    "Event",
    "EventTarget",
] }
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
bincode = "1.3"
base64 = "0.21"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "vecdb_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
