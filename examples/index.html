<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VecDB-WASM ⚡ Cyberpunk Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-green: #00ff00;
            --neon-yellow: #ffff00;
            --neon-purple: #9d00ff;
            --dark-bg: #0a0a0f;
            --dark-card: #1a1a2e;
            --grid-color: rgba(0, 255, 255, 0.1);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 5px var(--neon-cyan),
                            0 0 10px var(--neon-cyan),
                            0 0 20px var(--neon-cyan);
            }
            50% {
                box-shadow: 0 0 10px var(--neon-cyan),
                            0 0 20px var(--neon-cyan),
                            0 0 40px var(--neon-cyan);
            }
        }

        @keyframes floatGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: var(--dark-bg);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: floatGrid 4s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(transparent, rgba(0, 255, 255, 0.03), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.9) 0%, rgba(10, 10, 15, 0.9) 100%);
            border: 2px solid var(--neon-cyan);
            border-radius: 0;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5),
                        inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple), var(--neon-cyan));
            z-index: -1;
            filter: blur(10px);
            opacity: 0.3;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5em;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            margin-bottom: 15px;
            letter-spacing: 5px;
            animation: glitch 10s infinite;
        }

        .header p {
            color: var(--neon-cyan);
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .content {
            display: grid;
            gap: 20px;
        }

        .section {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid var(--neon-cyan);
            border-left: 3px solid var(--neon-magenta);
            padding: 25px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        .section h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 1.8em;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '▶';
            color: var(--neon-magenta);
            animation: pulse 2s infinite;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        input, select {
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-purple);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            background: rgba(0, 255, 255, 0.05);
        }

        input::placeholder {
            color: rgba(0, 255, 255, 0.3);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            box-shadow: 0 0 20px var(--neon-cyan),
                        inset 0 0 20px rgba(0, 255, 255, 0.2);
            transform: translateY(-2px);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        button:disabled:hover {
            box-shadow: none;
            transform: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            border: 1px solid var(--neon-purple);
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--neon-purple);
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 2px;
        }

        .results {
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .results::-webkit-scrollbar {
            width: 8px;
        }

        .results::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .results::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            box-shadow: 0 0 5px var(--neon-cyan);
        }

        .result-item {
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.05), transparent);
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid var(--neon-magenta);
            border-right: 1px solid var(--neon-purple);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-item:hover {
            background: rgba(0, 255, 255, 0.1);
            border-left-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .result-id {
            font-weight: 600;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .result-score {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            color: var(--dark-bg);
            padding: 8px 20px;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .log {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            position: relative;
        }

        .log::before {
            content: '> SYSTEM LOG';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 255, 0, 0.1);
            padding: 5px 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--neon-green);
        }

        .log::-webkit-scrollbar {
            width: 8px;
        }

        .log::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .log::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            box-shadow: 0 0 5px var(--neon-green);
        }

        .log-entry {
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
            margin-top: 40px;
        }

        .log-entry:first-child {
            margin-top: 45px;
        }

        .log-entry::before {
            content: '►';
            position: absolute;
            left: 0;
            color: var(--neon-cyan);
            animation: pulse 2s infinite;
        }

        .loading {
            text-align: center;
            padding: 80px 40px;
        }

        .loading p {
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 30px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 255, 255, 0.1);
            border-top: 4px solid var(--neon-cyan);
            border-right: 4px solid var(--neon-magenta);
            border-bottom: 4px solid var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite, glow 2s ease-in-out infinite;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Glitch text effect for errors */
        .error {
            color: var(--neon-magenta);
            animation: glitch 0.3s infinite;
        }

        /* Corner decorations */
        .section::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            border-right: 2px solid var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ VECDB-WASM ⚡</h1>
            <p>◈ High-Performance Vector Database ◈ Browser Edition ◈</p>
        </div>

        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>[ INITIALIZING WASM CORE... ]</p>
            </div>

            <div id="app" style="display: none;">
                <!-- Configuration -->
                <div class="section">
                    <h2>Configuration</h2>
                    <div class="controls">
                        <div class="control-group">
                            <label for="dimension">◈ Dimension</label>
                            <input type="number" id="dimension" value="128" min="1">
                        </div>
                        <div class="control-group">
                            <label for="metric">◈ Distance Metric</label>
                            <select id="metric">
                                <option value="Cosine">Cosine</option>
                                <option value="Euclidean">Euclidean</option>
                                <option value="DotProduct">Dot Product</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="indexType">◈ Index Type</label>
                            <select id="indexType">
                                <option value="Flat">Flat (Baseline)</option>
                                <option value="HNSW">HNSW (Fast)</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>&nbsp;</label>
                            <button onclick="createDB()">[ CREATE DATABASE ]</button>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="section">
                    <h2>Statistics</h2>
                    <div class="stats">
                        <div class="stat-card">
                            <div class="stat-value" id="vectorCount">0</div>
                            <div class="stat-label">Vectors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="dimension-stat">-</div>
                            <div class="stat-label">Dimension</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="lastSearchTime">-</div>
                            <div class="stat-label">Last Search (ms)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="throughput">-</div>
                            <div class="stat-label">QPS</div>
                        </div>
                    </div>
                </div>

                <!-- Operations -->
                <div class="section">
                    <h2>Operations</h2>
                    <div class="controls">
                        <div class="control-group">
                            <label for="numVectors">◈ Number of Vectors</label>
                            <input type="number" id="numVectors" value="1000" min="1">
                        </div>
                        <div class="control-group">
                            <label>&nbsp;</label>
                            <button onclick="generateRandomVectors()">[ GENERATE VECTORS ]</button>
                        </div>
                        <div class="control-group">
                            <label for="topK">◈ Top K Results</label>
                            <input type="number" id="topK" value="10" min="1">
                        </div>
                        <div class="control-group">
                            <label>&nbsp;</label>
                            <button onclick="searchRandom()">[ EXECUTE SEARCH ]</button>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="section">
                    <h2>Search Results</h2>
                    <div id="results"></div>
                </div>

                <!-- Log -->
                <div class="section">
                    <h2>Console Log</h2>
                    <div class="log" id="log"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { VectorDB, IndexType, Metric } from '../pkg/vecdb_wasm.js';

        let db = null;
        let dimension = 128;

        function log(message, isError = false) {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (isError ? ' error' : '');
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.createDB = function() {
            dimension = parseInt(document.getElementById('dimension').value);
            const metric = Metric[document.getElementById('metric').value];
            const indexType = IndexType[document.getElementById('indexType').value];

            try {
                db = new VectorDB(dimension, metric, indexType);
                document.getElementById('dimension-stat').textContent = dimension;
                log(`DATABASE INITIALIZED >> dimension=${dimension}, metric=${document.getElementById('metric').value}, index=${document.getElementById('indexType').value}`);
                updateStats();
            } catch (e) {
                log(`ERROR: ${e}`, true);
            }
        };

        window.generateRandomVectors = function() {
            if (!db) {
                log('ERROR: DATABASE NOT INITIALIZED', true);
                return;
            }

            const numVectors = parseInt(document.getElementById('numVectors').value);
            const startTime = performance.now();

            try {
                for (let i = 0; i < numVectors; i++) {
                    const vector = new Float32Array(dimension);
                    for (let j = 0; j < dimension; j++) {
                        vector[j] = Math.random() * 2 - 1;
                    }
                    const metadata = JSON.stringify({
                        name: `vector_${i}`,
                        created: new Date().toISOString()
                    });
                    db.insert(i, Array.from(vector), metadata);
                }

                const elapsed = performance.now() - startTime;
                log(`VECTOR INSERTION COMPLETE >> ${numVectors} vectors in ${elapsed.toFixed(2)}ms (${(numVectors / (elapsed / 1000)).toFixed(0)} vectors/sec)`);
                updateStats();
            } catch (e) {
                log(`ERROR: ${e}`, true);
            }
        };

        window.searchRandom = function() {
            if (!db || db.len() === 0) {
                log('ERROR: NO VECTORS IN DATABASE', true);
                return;
            }

            const k = parseInt(document.getElementById('topK').value);
            const query = new Float32Array(dimension);
            for (let i = 0; i < dimension; i++) {
                query[i] = Math.random() * 2 - 1;
            }

            const startTime = performance.now();
            try {
                const results = db.search(Array.from(query), k, true);
                const elapsed = performance.now() - startTime;

                document.getElementById('lastSearchTime').textContent = elapsed.toFixed(2);
                document.getElementById('throughput').textContent = (1000 / elapsed).toFixed(0);

                displayResults(results);
                log(`SEARCH QUERY EXECUTED >> ${elapsed.toFixed(2)}ms, ${results.length} results found`);
            } catch (e) {
                log(`ERROR: ${e}`, true);
            }
        };

        function displayResults(results) {
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = '';

            if (results.length === 0) {
                resultsEl.innerHTML = '<div style="color: var(--neon-purple); text-align: center; padding: 20px;">[ NO RESULTS FOUND ]</div>';
                return;
            }

            results.forEach((result, idx) => {
                const item = document.createElement('div');
                item.className = 'result-item';

                const info = document.createElement('div');
                info.innerHTML = `
                    <div class="result-id">VECTOR_ID: ${result.id}</div>
                    ${result.metadata ? `<small style="color: var(--neon-purple); font-size: 0.85em;">${result.metadata}</small>` : ''}
                `;

                const score = document.createElement('div');
                score.className = 'result-score';
                score.textContent = result.score.toFixed(4);

                item.appendChild(info);
                item.appendChild(score);
                resultsEl.appendChild(item);
            });
        }

        function updateStats() {
            if (db) {
                document.getElementById('vectorCount').textContent = db.len();
            }
        }

        // Initialize
        async function main() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                log('SYSTEM ONLINE >> VecDB-WASM initialized successfully');

                // Create default database
                createDB();
            } catch (e) {
                log(`CRITICAL ERROR >> ${e}`, true);
            }
        }

        main();
    </script>
</body>
</html>
