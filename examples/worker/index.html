<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VecDB-WASM Worker Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        input[type="number"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: 120px;
        }

        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
        }

        .log-entry.info {
            color: #00ff00;
        }

        .log-entry.success {
            color: #00ffff;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.warning {
            color: #ffd93d;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 1.5em;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 VecDB-WASM Worker Example</h1>
        <p class="subtitle">Non-blocking Vector Database with Web Workers</p>

        <div class="section">
            <h2>📊 Database Info</h2>
            <div id="dbInfo" class="stats">
                <div class="stat-card">
                    <div class="stat-label">Status</div>
                    <div class="stat-value" id="status">Not Initialized</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Vectors</div>
                    <div class="stat-value" id="vectorCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Dimension</div>
                    <div class="stat-value" id="dimension">-</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>⚡ Performance Metrics</h2>
            <div id="metricsInfo" class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Searches</div>
                    <div class="stat-value" id="totalSearches">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Search Time</div>
                    <div class="stat-value" id="avgSearchTime">0ms</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Inserts</div>
                    <div class="stat-value" id="totalInserts">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Insert Time</div>
                    <div class="stat-value" id="avgInsertTime">0ms</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>🎮 Controls</h2>
            <div class="controls">
                <button onclick="initDB()">Initialize DB</button>
                <button onclick="insertRandom()" id="insertBtn" disabled>Insert Random Vector</button>
                <button onclick="batchInsert()" id="batchBtn" disabled>Batch Insert (1000)</button>
                <button onclick="performSearch()" id="searchBtn" disabled>Search</button>
                <button onclick="showMetrics()" id="metricsBtn" disabled>Show Metrics</button>
                <button onclick="clearDB()" id="clearBtn" disabled>Clear DB</button>
            </div>
        </div>

        <div class="section">
            <h2>📝 Activity Log</h2>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script type="module">
        import { VectorDBWorker } from './vecdb-worker-client.js';

        let db = null;
        const DIMENSION = 128;

        window.initDB = async function() {
            try {
                log('Initializing VecDB Worker...', 'info');
                db = new VectorDBWorker('./vecdb.worker.js');

                // Create database with HNSW index
                await db.create(DIMENSION, 0, 1); // Cosine, HNSW

                log('✓ Database initialized successfully!', 'success');
                document.getElementById('status').textContent = 'Ready';
                document.getElementById('dimension').textContent = DIMENSION;

                // Enable buttons
                ['insertBtn', 'batchBtn', 'searchBtn', 'metricsBtn', 'clearBtn'].forEach(id => {
                    document.getElementById(id).disabled = false;
                });

                await updateStats();
            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
            }
        };

        window.insertRandom = async function() {
            try {
                const vector = Array(DIMENSION).fill(0).map(() => Math.random());
                const id = Date.now();
                const metadata = JSON.stringify({ type: 'random', timestamp: id });

                await db.insert(id, vector, metadata);
                log(`✓ Inserted vector ${id}`, 'success');

                await updateStats();
            } catch (error) {
                log(`✗ Insert error: ${error.message}`, 'error');
            }
        };

        window.batchInsert = async function() {
            try {
                log('Batch inserting 1000 vectors...', 'info');
                const startTime = performance.now();

                const vectors = [];
                for (let i = 0; i < 1000; i++) {
                    vectors.push({
                        id: Date.now() + i,
                        vector: Array(DIMENSION).fill(0).map(() => Math.random()),
                        metadata: { type: 'batch', index: i }
                    });
                }

                const count = await db.batchInsert(vectors);
                const elapsed = (performance.now() - startTime).toFixed(2);

                log(`✓ Inserted ${count} vectors in ${elapsed}ms`, 'success');
                await updateStats();
            } catch (error) {
                log(`✗ Batch insert error: ${error.message}`, 'error');
            }
        };

        window.performSearch = async function() {
            try {
                const query = Array(DIMENSION).fill(0).map(() => Math.random());
                const startTime = performance.now();

                const results = await db.search(query, 10, true);
                const elapsed = (performance.now() - startTime).toFixed(2);

                log(`✓ Search completed in ${elapsed}ms, found ${results.length} results`, 'success');

                if (results.length > 0) {
                    log(`  Top result: ID=${results[0].id}, Score=${results[0].score.toFixed(4)}`, 'info');
                }

                await updateStats();
            } catch (error) {
                log(`✗ Search error: ${error.message}`, 'error');
            }
        };

        window.showMetrics = async function() {
            try {
                const metrics = await db.getPerformanceMetrics();
                log('Performance Metrics:', 'warning');
                log(`  Searches: ${metrics.total_searches}, Avg: ${metrics.avg_search_time_ms.toFixed(2)}ms, Peak: ${metrics.peak_search_time_ms.toFixed(2)}ms`, 'info');
                log(`  Inserts: ${metrics.total_inserts}, Avg: ${metrics.avg_insert_time_ms.toFixed(2)}ms`, 'info');
                log(`  Batch Ops: ${metrics.total_batch_ops}, Total Vectors: ${metrics.total_batch_vectors}`, 'info');

                await updateMetrics(metrics);
            } catch (error) {
                log(`✗ Metrics error: ${error.message}`, 'error');
            }
        };

        window.clearDB = async function() {
            try {
                await db.clear();
                log('✓ Database cleared', 'success');
                await updateStats();
            } catch (error) {
                log(`✗ Clear error: ${error.message}`, 'error');
            }
        };

        async function updateStats() {
            try {
                const count = await db.len();
                document.getElementById('vectorCount').textContent = count;
            } catch (error) {
                console.error('Update stats error:', error);
            }
        }

        async function updateMetrics(metrics) {
            document.getElementById('totalSearches').textContent = metrics.total_searches;
            document.getElementById('avgSearchTime').textContent = metrics.avg_search_time_ms.toFixed(2) + 'ms';
            document.getElementById('totalInserts').textContent = metrics.total_inserts;
            document.getElementById('avgInsertTime').textContent = metrics.avg_insert_time_ms.toFixed(2) + 'ms';
        }

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Auto-refresh stats
        setInterval(async () => {
            if (db) {
                await updateStats();
            }
        }, 5000);

        log('Worker example loaded. Click "Initialize DB" to start.', 'info');
    </script>
</body>
</html>
